name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: simon
          POSTGRES_PASSWORD: simon
          POSTGRES_DB: simon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://simon:simon@localhost:5432/simon
      PAYLOAD_SECRET: ci-only-payload-secret-0123456789abcdef
      AUTH_SECRET: ci-only-auth-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; version comes from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on critical)
        run: pnpm audit --audit-level=critical
      - name: Dependency audit (full report, informational)
        run: pnpm audit --prod
        continue-on-error: true
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:int
      - name: Build
        run: pnpm build
      - name: Apply migrations to the CI database
        run: pnpm payload migrate
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
