name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: simon
          POSTGRES_PASSWORD: simon
          POSTGRES_DB: simon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://simon:simon@localhost:5432/simon
      PAYLOAD_SECRET: ci-only-payload-secret-0123456789abcdef
      AUTH_SECRET: ci-only-auth-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:int
      - name: Build
        run: pnpm build
      - name: Apply migrations to the CI database
        run: pnpm payload migrate
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
