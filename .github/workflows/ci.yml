name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: simon
          POSTGRES_PASSWORD: simon
          POSTGRES_DB: simon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://simon:simon@localhost:5432/simon
      PAYLOAD_SECRET: ci-only-payload-secret-0123456789abcdef
      AUTH_SECRET: ci-only-auth-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; version comes from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on critical)
        run: pnpm audit --audit-level=critical
      - name: Dependency audit (full report, informational)
        run: pnpm audit --prod
        continue-on-error: true
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:int
      - name: Build
        run: pnpm build
      - name: Apply migrations to the CI database
        run: pnpm payload migrate
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
