# Local Postgres for development. See docs/local-development.md.
# DATABASE_URL=postgresql://simon:simon@localhost:5432/simon
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simon
      POSTGRES_PASSWORD: simon
      POSTGRES_DB: simon
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
